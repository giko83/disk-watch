name: Disk Watch smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n disk-watch.sh install.sh update.sh scripts/build-portable.sh tests/test-disk-watch.sh tests/test-mail-transport.sh tests/test-portable.sh tests/test-portable-package.sh
      - name: Run isolated journal and notification tests
        run: |
          bash tests/test-disk-watch.sh
          bash tests/test-mail-transport.sh
          bash tests/test-portable.sh
          bash tests/test-portable-package.sh
