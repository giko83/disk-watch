name: Disk Watch smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    name: Offline smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Verify unprivileged offline toolchain
        run: |
          test "$(id -u)" -ne 0
          bash --version | head -n 1
          tar --version | head -n 1
          gzip --version | head -n 1
          sha256sum --version | head -n 1
      - name: Check Bash syntax
        run: |
          for script in disk-watch.sh disk-watch-health.sh install.sh update.sh scripts/build-portable.sh scripts/backup-installed.sh scripts/check-config.sh scripts/verify-installed-snapshot.sh scripts/plan-installed-restore.sh scripts/rehearse-installed-restore.sh tests/*.sh; do
            bash -n "$script"
          done
          sh -n disk-watch-smart.sh
      - name: Run isolated journal and notification tests
        run: |
          bash tests/test-disk-watch.sh
          bash tests/test-mail-transport.sh
          bash tests/test-portable.sh
          bash tests/test-portable-package.sh
          bash tests/test-install-preflight.sh
          bash tests/test-backup.sh
          bash tests/test-verify-snapshot.sh
          bash tests/test-update.sh
          bash tests/test-health.sh
