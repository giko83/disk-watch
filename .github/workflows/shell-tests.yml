name: Shell regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n disk-watch.sh install.sh update.sh tests/test-scan.sh
      - name: Test scan cursor and delivery handling
        run: bash tests/test-scan.sh
