name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n disk-watch.sh install.sh update.sh tests/test_disk_watch.sh
          sh -n disk-watch-smart.sh
      - name: Run isolated tests
        run: bash tests/test_disk_watch.sh
